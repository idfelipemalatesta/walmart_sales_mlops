[project]
name = "walmart-sales-mlops"
version = "0.1.0"
description = "MLOps project for Walmart sales forecasting"
requires-python = ">=3.10"
dependencies = [
    "Flask==3.1.0",
    "joblib==1.4.2",
    "optuna==4.2.1",
    "pandas>=2.0.0",
    "pytest==8.3.5",
    "PyYAML==6.0.2",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
]
